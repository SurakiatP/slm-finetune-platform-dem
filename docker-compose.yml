name: slm-platform

# Backend-only PoC for the Automated SLM Fine-Tuning Platform.
# Stack locked by ADR-001. GPU is provided to `worker` and `ollama` only.

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-slm}:${POSTGRES_PASSWORD:-slm}@postgres:5432/${POSTGRES_DB:-slm}
  ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-slm}:${POSTGRES_PASSWORD:-slm}@postgres:5432/${POSTGRES_DB:-slm}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MLFLOW_TRACKING_URI: http://mlflow:5000
  # Browser-facing MLflow URL for clickable run links (in-network hostname
  # "mlflow" is not resolvable from a browser). Override per-deployment.
  MLFLOW_PUBLIC_URL: ${MLFLOW_PUBLIC_URL:-http://localhost:5000}
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_DATASETS_BUCKET: ${MINIO_DATASETS_BUCKET:-datasets}
  MINIO_MODELS_BUCKET: ${MINIO_MODELS_BUCKET:-models}
  MLFLOW_S3_BUCKET: ${MLFLOW_S3_BUCKET:-mlflow}
  OLLAMA_BASE_URL: http://ollama:11434
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENROUTER_TEACHER_MODEL: ${OPENROUTER_TEACHER_MODEL:-anthropic/claude-3.5-sonnet}
  DEFAULT_BASE_MODEL: ${DEFAULT_BASE_MODEL:-unsloth/Llama-3.2-3B-Instruct-bnb-4bit}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

x-gpu-deploy: &gpu-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:
  postgres:
    image: postgres:16-alpine
    container_name: slm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slm}
      POSTGRES_DB: ${POSTGRES_DB:-slm}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first init (empty volume). Creates the separate
      # `mlflow` database referenced by the mlflow service below.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slm} -d ${POSTGRES_DB:-slm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [slm-net]

  redis:
    image: redis:7-alpine
    container_name: slm-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [slm-net]

  minio:
    image: minio/minio:latest
    container_name: slm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [slm-net]

  minio-init:
    image: minio/mc:latest
    container_name: slm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..." && sleep 2
        done
        mc mb --ignore-existing local/$$MLFLOW_S3_BUCKET
        mc mb --ignore-existing local/$$MINIO_DATASETS_BUCKET
        mc mb --ignore-existing local/$$MINIO_MODELS_BUCKET
        echo "minio buckets ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_BUCKET: ${MLFLOW_S3_BUCKET:-mlflow}
      MINIO_DATASETS_BUCKET: ${MINIO_DATASETS_BUCKET:-datasets}
      MINIO_MODELS_BUCKET: ${MINIO_MODELS_BUCKET:-models}
    networks: [slm-net]

  mlflow:
    # Pre-built in CI and pushed to GHCR (see .github/workflows/build-images.yml).
    # On the VM, `docker compose pull` fetches this instead of building locally —
    # the 15 GB pasaflow box reboots under a from-scratch build. `build:` is kept
    # so local dev can still `docker compose build`.
    image: ghcr.io/surakiatp/slm-mlflow:dev
    build:
      context: ./docker
      dockerfile: mlflow.Dockerfile
    container_name: slm-mlflow
    restart: unless-stopped
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      # MLflow MUST have its own database. Sharing `${POSTGRES_DB}` with the
      # app makes MLflow's auto-run alembic clobber the app's `alembic_version`
      # row, blocking application migrations.
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:-slm}:${POSTGRES_PASSWORD:-slm}@postgres:5432/${MLFLOW_DB:-mlflow}
      - --default-artifact-root=s3://${MLFLOW_S3_BUCKET:-mlflow}/
      - --serve-artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [slm-net]

  api:
    image: ghcr.io/surakiatp/slm-api:dev
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: slm-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    ports:
      # The ONLY service published beyond the host. Every other container
      # binds 127.0.0.1 so an external port scan reaches nothing but this
      # API (BACKEND_GAP_ANALYSIS.md P0 "Secrets และขอบเขตเครือข่าย").
      # Loopback binding, not removal, deliberately: `scripts/
      # deploy_pasaflow_vm.sh` hands the operator localhost URLs for the
      # MinIO console / MLflow / Ollama, and those still work over an SSH
      # tunnel (`ssh -L 9001:localhost:9001`). Dropping `ports:` entirely
      # would break that workflow and force `docker compose exec` for every
      # debugging session.
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app/api
      - ./ai_engine:/app/ai_engine
      - ./workers:/app/workers
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./tests:/app/tests:ro
    command:
      - uvicorn
      - api.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks: [slm-net]

  worker:
    image: ghcr.io/surakiatp/slm-worker:dev
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: slm-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      HF_HOME: /root/.cache/huggingface
      # bitsandbytes 0.49.x bundled with the cu130 PyTorch wheel needs
      # libnvJitLink.so.13 from the nvidia cu13 site-packages dir, which
      # lives outside the default loader path. Without this prefix, 4-bit
      # dequantization fails at training time with "libnvJitLink.so.13:
      # cannot open shared object file".
      LD_LIBRARY_PATH: /opt/conda/lib/python3.11/site-packages/nvidia/cu13/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    volumes:
      - ./api:/app/api
      - ./ai_engine:/app/ai_engine
      - ./workers:/app/workers
      - hf-cache:/root/.cache/huggingface
    command:
      - celery
      - -A
      - workers.celery_app
      - worker
      - --loglevel=INFO
      # Only the GPU queue: sdg.generate now routes to `-Q cpu` on the
      # worker-cpu service below (see workers/celery_app.py task_routes),
      # so this worker no longer needs to also drain the default queue.
      - -Q
      - gpu
      - --concurrency=1
    # GPU access uses Compose's `deploy.resources.reservations.devices`
    # (works without daemon-level nvidia runtime). The legacy
    # `runtime: nvidia` field was removed because it errors out on hosts
    # that don't register the runtime via /etc/docker/daemon.json.
    deploy: *gpu-deploy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
      ollama:
        condition: service_started
    networks: [slm-net]

  # CPU-only queue for `sdg.generate` (see workers/celery_app.py
  # task_routes). SDG calls OpenRouter over HTTP and does no GPU work, so it
  # no longer has to wait behind — or block — GPU training/export/eval jobs
  # on the single `worker` service above.
  #
  # Placed AFTER `worker` deliberately: tests/unit/test_compose_port_exposure.py
  # slices this file's text on the literal `"  worker:"` marker to isolate
  # the `api` service block, and `"  worker-cpu:"` does not contain that
  # substring — but appending a new service ahead of `worker` could still
  # shift surrounding text in ways future edits don't expect. Keeping the
  # ordering worker, then worker-cpu keeps that slice stable.
  worker-cpu:
    # Reuses the API image rather than building a new one: docker/api.
    # Dockerfile already does `COPY workers ./workers` and installs the full
    # base dependency set (celery, openai, tenacity, redis, sqlalchemy) that
    # `workers.tasks.data_generation` needs. `torch` (and the GPU worker's
    # CUDA toolchain) only exists in the optional `training` extra used by
    # `docker/worker.Dockerfile`, which this queue never imports. So: no new
    # Dockerfile, no second image build, no `build:` block here.
    image: ghcr.io/surakiatp/slm-api:dev
    container_name: slm-worker-cpu
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - ./api:/app/api
      - ./ai_engine:/app/ai_engine
      - ./workers:/app/workers
    command:
      - celery
      - -A
      - workers.celery_app
      - worker
      - --loglevel=INFO
      - -Q
      - cpu
      - --concurrency=2
    # No `ports:` — tests/unit/test_compose_port_exposure.py fails the
    # "only `api` is externally published" guard if any other service
    # (this one included) publishes a port. This is an internal Celery
    # worker with nothing to serve.
    # No GPU `deploy:` block — this queue is CPU-only by design (see the
    # image comment above); requesting a GPU reservation here would just
    # make the service fail to schedule on a single-GPU host it doesn't need.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [slm-net]

  ollama:
    image: ollama/ollama:latest
    container_name: slm-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy: *gpu-deploy
    networks: [slm-net]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
  hf-cache:

networks:
  slm-net:
    driver: bridge
