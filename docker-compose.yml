name: slm-platform

# Backend-only PoC for the Automated SLM Fine-Tuning Platform.
# Stack locked by ADR-001. GPU is provided to `worker` and `ollama` only.

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-slm}:${POSTGRES_PASSWORD:-slm}@postgres:5432/${POSTGRES_DB:-slm}
  ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-slm}:${POSTGRES_PASSWORD:-slm}@postgres:5432/${POSTGRES_DB:-slm}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MLFLOW_TRACKING_URI: http://mlflow:5000
  # Browser-facing MLflow URL for clickable run links (in-network hostname
  # "mlflow" is not resolvable from a browser). Override per-deployment.
  MLFLOW_PUBLIC_URL: ${MLFLOW_PUBLIC_URL:-http://localhost:5000}
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_DATASETS_BUCKET: ${MINIO_DATASETS_BUCKET:-datasets}
  MINIO_MODELS_BUCKET: ${MINIO_MODELS_BUCKET:-models}
  MLFLOW_S3_BUCKET: ${MLFLOW_S3_BUCKET:-mlflow}
  OLLAMA_BASE_URL: http://ollama:11434
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENROUTER_TEACHER_MODEL: ${OPENROUTER_TEACHER_MODEL:-anthropic/claude-3.5-sonnet}
  DEFAULT_BASE_MODEL: ${DEFAULT_BASE_MODEL:-unsloth/Llama-3.2-3B-Instruct-bnb-4bit}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

x-gpu-deploy: &gpu-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:
  postgres:
    image: postgres:16-alpine
    container_name: slm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slm}
      POSTGRES_DB: ${POSTGRES_DB:-slm}
      # Consumed by docker/postgres-init.sql's `\getenv` on first (empty
      # volume) init only, to create mlflow's own role — see that file and
      # the `mlflow` service below for why it doesn't share ${POSTGRES_USER}.
      MLFLOW_DB_USER: ${MLFLOW_DB_USER:-mlflow}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first init (empty volume). Creates the separate
      # `mlflow` database referenced by the mlflow service below.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slm} -d ${POSTGRES_DB:-slm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [slm-net]

  redis:
    image: redis:7-alpine
    container_name: slm-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [slm-net]

  minio:
    image: minio/minio:latest
    container_name: slm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [slm-net]

  minio-init:
    image: minio/mc:latest
    container_name: slm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..." && sleep 2
        done
        mc mb --ignore-existing local/$$MLFLOW_S3_BUCKET
        mc mb --ignore-existing local/$$MINIO_DATASETS_BUCKET
        mc mb --ignore-existing local/$$MINIO_MODELS_BUCKET
        echo "minio buckets ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_BUCKET: ${MLFLOW_S3_BUCKET:-mlflow}
      MINIO_DATASETS_BUCKET: ${MINIO_DATASETS_BUCKET:-datasets}
      MINIO_MODELS_BUCKET: ${MINIO_MODELS_BUCKET:-models}
    networks: [slm-net]

  mlflow:
    # Pre-built in CI and pushed to GHCR (see .github/workflows/build-images.yml).
    # On the VM, `docker compose pull` fetches this instead of building locally —
    # the 15 GB pasaflow box reboots under a from-scratch build. `build:` is kept
    # so local dev can still `docker compose build`.
    image: ghcr.io/surakiatp/slm-mlflow:dev
    build:
      context: ./docker
      dockerfile: mlflow.Dockerfile
    container_name: slm-mlflow
    restart: unless-stopped
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # MLflow MUST have its own database. Sharing `${POSTGRES_DB}` with the
      # app makes MLflow's auto-run alembic clobber the app's `alembic_version`
      # row, blocking application migrations. Own role too (not
      # ${POSTGRES_USER}/${POSTGRES_PASSWORD}) — see docker/postgres-init.sql.
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@postgres:5432/${MLFLOW_DB:-mlflow}
    # `sh -c 'exec mlflow server ...'` reading the DSN from
    # $MLFLOW_BACKEND_STORE_URI (set above), rather than the previous plain
    # `command:` list with the DSN spelled out as a `--backend-store-uri=...`
    # argument, moves the password from Cmd to Env. Be honest about what
    # this buys: `docker inspect` on this container shows BOTH Config.Cmd
    # and Config.Env, so someone with docker-group access (or the daemon
    # socket) sees the password either way — this is not a secret-manager-
    # grade fix. What it does close: `ps aux` / `docker top` show a
    # container's argv to ANY local user who can list processes, with no
    # docker permissions required at all, and that path no longer has the
    # password in it. `exec` (not a bare `mlflow server ...`) keeps mlflow
    # as PID 1 so `docker compose stop` still delivers SIGTERM to it
    # directly instead of to an intermediate shell.
    command:
      - sh
      - -c
      - >-
        exec mlflow server --host=0.0.0.0 --port=5000
        --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
        --default-artifact-root=s3://${MLFLOW_S3_BUCKET:-mlflow}/
        --serve-artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [slm-net]

  api:
    image: ghcr.io/surakiatp/slm-api:dev
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: slm-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    ports:
      # Zero externally published ports (round 3): `edge` is the sole
      # ingress, reached only through `cloudflared`, and `api` now binds
      # 127.0.0.1 like every other internal service. This is a change from
      # round 1's "the API is the one public service" — that model is gone.
      # `edge`'s `real_ip`/`X-Forwarded-*` trust of the whole compose
      # network (see docker/edge.nginx.conf's top-of-file comment) depends
      # on this staying true: if `api` (or anything else) ever gets a
      # `0.0.0.0`-published port again, a caller could reach it directly,
      # skip `edge` entirely, and both the rate limits and the XFF-overwrite
      # trust boundary would be bypassable. Loopback binding, not removal,
      # deliberately: local debugging (`curl localhost:8000/...` or an SSH
      # tunnel on the VM) still works; an external port scan does not.
      # tests/unit/test_compose_port_exposure.py is what guards this.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # No rw source bind-mounts here (./api, ./ai_engine, ./workers,
      # ./alembic) — docker/api.Dockerfile already COPYs all of them into
      # the image, so the mounts only mattered for `--reload`, which is
      # gone from `command:` below. See docker-compose.dev.yml to restore
      # both together for local development.
      #
      # `./tests:ro` stays: docker/api.Dockerfile does NOT COPY tests/, but
      # the VM's `pytest tests/unit/` step (see the deploy runbook) runs
      # `docker compose exec api ...` against this exact container.
      - ./tests:/app/tests:ro
    command:
      - uvicorn
      - api.main:app
      - --host=0.0.0.0
      - --port=8000
      # No --reload (see docker-compose.dev.yml). --proxy-headers +
      # --forwarded-allow-ips=* trust X-Forwarded-For/-Proto from the proxy
      # in front of this container — safe specifically because that proxy
      # is always `edge` over the compose network (never a public
      # interface; see the `ports:` comment above), and `edge` itself
      # overwrites (not appends to) X-Forwarded-For before proxying, so
      # there is exactly one hop to trust, not an open relay.
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks: [slm-net]

  # Sole ingress-facing HTTP surface. Serves the SPA static root, proxies
  # /api/ + /ws/ to `api`, and (on the storage subdomain, same nginx
  # process, separate `server_name`) proxies to `minio` for presigned
  # downloads. See docker/edge.nginx.conf for the actual routing/rate-limit
  # rules — this service block only wires it up.
  edge:
    image: nginx:1.27-alpine
    container_name: slm-edge
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGE_PORT:-8088}:80"
    volumes:
      - ./docker/edge.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Whichever frontend eventually wins (this repo's own frontend/ on
      # feat/web-ui, or something else) points SPA_DIST_DIR at its built
      # `dist/`. Defaults to the committed placeholder so `docker compose
      # up` works with nothing else configured.
      - ${SPA_DIST_DIR:-./docker/spa-placeholder}:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks: [slm-net]

  # Cloudflare Tunnel — the ONLY thing that reaches this host from the
  # public internet. Deliberately no `ports:` block: this container makes
  # outbound-only connections to Cloudflare's edge and needs nothing
  # inbound on this host. Ingress rules live in docker/cloudflared/
  # config.yml (locally-managed, in-repo — see that file's header comment
  # for why token/dashboard mode was rejected) and route everything to
  # `edge`, never straight to `api`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: slm-cloudflared
    restart: unless-stopped
    volumes:
      # Order matters: the creds dir is mounted at the PARENT path first,
      # then config.yml is mounted on top at a path inside it — reversed,
      # the broader mount would shadow the more specific one and hide
      # config.yml.
      - ${CLOUDFLARE_TUNNEL_CREDS_DIR:-./.cloudflared}:/etc/cloudflared:ro
      - ./docker/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    # Opt-in: `docker compose up` skips this service, the deploy script runs
    # `--profile tunnel`. Local development has no tunnel to run and no
    # credentials to run it with, and without a profile this container would
    # crash-loop forever under `restart: unless-stopped`.
    profiles: ["tunnel"]
    # The tunnel id is an ARGUMENT here, not a `tunnel:` key inside
    # config.yml. Compose interpolates this file; it does not interpolate the
    # contents of a bind-mounted one, so a `${...}` placeholder in config.yml
    # would reach cloudflared verbatim and the tunnel would never start —
    # silently, since nothing else in the stack depends on it booting.
    #
    # `:-` and NOT `:?`. Compose interpolates the whole file before it selects
    # services or profiles, and treats `:?` as an error when the variable is
    # unset *or empty* — and `.env.example` ships it empty. A `:?` here
    # therefore broke `docker compose up`, `build`, `config` and even `ps`
    # for anyone following the README's `cp .env.example .env` quickstart:
    # the same "the example file breaks the flow it documents" bug as the
    # API_ALLOWED_HOSTS one, reintroduced by its own fix. Requiring the value
    # belongs where a deployment actually happens — scripts/
    # deploy_pasaflow_vm.sh's pre-flight — not in a file every local
    # `docker compose` invocation has to parse.
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
      - ${CLOUDFLARE_TUNNEL_ID:-}
    depends_on:
      - edge
    networks: [slm-net]

  worker:
    image: ghcr.io/surakiatp/slm-worker:dev
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: slm-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      HF_HOME: /root/.cache/huggingface
      # bitsandbytes 0.49.x bundled with the cu130 PyTorch wheel needs
      # libnvJitLink.so.13 from the nvidia cu13 site-packages dir, which
      # lives outside the default loader path. Without this prefix, 4-bit
      # dequantization fails at training time with "libnvJitLink.so.13:
      # cannot open shared object file".
      LD_LIBRARY_PATH: /opt/conda/lib/python3.11/site-packages/nvidia/cu13/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    volumes:
      # No rw source bind-mounts (./api, ./ai_engine, ./workers) — all three
      # are COPY'd into the image by docker/worker.Dockerfile, and this
      # service never ran with --reload in the first place (celery workers
      # don't autoreload on code change). See docker-compose.dev.yml.
      - hf-cache:/root/.cache/huggingface
    command:
      - celery
      - -A
      - workers.celery_app
      - worker
      - --loglevel=INFO
      # Only the GPU queue: sdg.generate now routes to `-Q cpu` on the
      # worker-cpu service below (see workers/celery_app.py task_routes),
      # so this worker no longer needs to also drain the default queue.
      - -Q
      - gpu
      - --concurrency=1
    # GPU access uses Compose's `deploy.resources.reservations.devices`
    # (works without daemon-level nvidia runtime). The legacy
    # `runtime: nvidia` field was removed because it errors out on hosts
    # that don't register the runtime via /etc/docker/daemon.json.
    deploy: *gpu-deploy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
      ollama:
        condition: service_started
    networks: [slm-net]

  # CPU-only queue for `sdg.generate` (see workers/celery_app.py
  # task_routes). SDG calls OpenRouter over HTTP and does no GPU work, so it
  # no longer has to wait behind — or block — GPU training/export/eval jobs
  # on the single `worker` service above.
  worker-cpu:
    # Reuses the API image rather than building a new one: docker/api.
    # Dockerfile already does `COPY workers ./workers` and installs the full
    # base dependency set (celery, openai, tenacity, redis, sqlalchemy) that
    # `workers.tasks.data_generation` needs. `torch` (and the GPU worker's
    # CUDA toolchain) only exists in the optional `training` extra used by
    # `docker/worker.Dockerfile`, which this queue never imports. So: no new
    # Dockerfile, no second image build, no `build:` block here.
    image: ghcr.io/surakiatp/slm-api:dev
    container_name: slm-worker-cpu
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    # No source bind-mounts — docker/api.Dockerfile (this service reuses
    # that image) already COPYs api/, ai_engine/, workers/, and celery
    # workers don't autoreload on code change regardless.
    command:
      - celery
      - -A
      - workers.celery_app
      - worker
      - --loglevel=INFO
      - -Q
      - cpu
      - --concurrency=2
    # No `ports:` — tests/unit/test_compose_port_exposure.py's
    # `PUBLIC_SERVICES = set()` fails the build if any service at all
    # (this one included) publishes a non-loopback port. This is an
    # internal Celery worker with nothing to serve externally.
    # No GPU `deploy:` block — this queue is CPU-only by design (see the
    # image comment above); requesting a GPU reservation here would just
    # make the service fail to schedule on a single-GPU host it doesn't need.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [slm-net]

  # Build-only: produces frontend/'s static dist/ (the retained backup SPA —
  # smart-model-tune is canonical, see ADR-011's note) and copies it into a
  # host directory that `edge` can then serve via SPA_DIST_DIR. Opt-in via
  # profile, like `cloudflared` above — a plain `docker compose up` must
  # never start it. It publishes no `ports:` at all (nothing listens; see
  # docker/frontend.Dockerfile), so it needs no loopback binding either,
  # unlike `edge`.
  #
  # The default here is `./frontend/dist` (gitignored), NOT `edge`'s
  # `./docker/spa-placeholder`. This is the only service that mounts the SPA
  # directory WRITABLE, and its entrypoint is `cp -r /dist/. /out/` — so
  # defaulting it to the placeholder meant running the usage line below,
  # verbatim, silently overwrote a committed file in the working tree.
  #
  # It deliberately does NOT use `${SPA_DIST_DIR:?...}` to force the operator
  # to set it. Compose interpolates the whole file before it selects services
  # or profiles, and treats `:?` as an error on an empty value too — so a `:?`
  # here would break `docker compose up/build/config/ps` for everyone,
  # including people who never touch this profile. That exact mistake was
  # already made once with CLOUDFLARE_TUNNEL_ID; see the `cloudflared` note.
  #
  # Usage:
  #   SPA_DIST_DIR=./frontend/dist docker compose --profile build-spa run --rm frontend-build
  #   # then start `edge` with the same SPA_DIST_DIR so it serves what was built
  frontend-build:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Compile-time Supabase auth config (see docker/frontend.Dockerfile).
        # Empty defaults build the auth-less bundle; export both env vars
        # before `--profile build-spa run` to build an authenticated bundle
        # for a backend with AUTH_REQUIRED=true. Anon key only — public by
        # design; never the service_role key or JWT secret.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    container_name: slm-frontend-build
    profiles: ["build-spa"]
    volumes:
      - ${SPA_DIST_DIR:-./frontend/dist}:/out
    networks: [slm-net]

  ollama:
    image: ollama/ollama:latest
    container_name: slm-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy: *gpu-deploy
    networks: [slm-net]

  # M4 observability-stack. Scrapes `api` (see docker/prometheus/
  # prometheus.yml's `api` job) and `gpu-exporter` below. Loopback-bound like
  # everything else — see tests/unit/test_compose_port_exposure.py.
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: slm-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    networks: [slm-net]

  # nvidia_gpu_exporter — GPU utilization/memory/temperature metrics for
  # Prometheus, scraped via the `gpu_exporter` job in docker/prometheus/
  # prometheus.yml. Uses the same GPU reservation pattern as `worker` and
  # `ollama` above (`*gpu-deploy`).
  #
  # KNOWN, EXPECTED STATE: this container is expected to stay DOWN on the
  # pasaflow prod box until a host-level nvidia driver bug there is fixed —
  # see WORKING_LOG.md. That is why nothing in this compose file
  # `depends_on` it and nothing gates its own health on this service's
  # health: a crash-looping `gpu-exporter` (restart: unless-stopped) must
  # never prevent `docker compose up` from bringing up the rest of the
  # stack, and no other service's `depends_on` may ever be pointed at it —
  # see tests/unit/test_prometheus_stack.py's depends_on guard.
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.13.1
    container_name: slm-gpu-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GPU_EXPORTER_PORT:-9835}:9835"
    deploy: *gpu-deploy
    networks: [slm-net]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
  hf-cache:
  prometheus-data:

networks:
  slm-net:
    driver: bridge
