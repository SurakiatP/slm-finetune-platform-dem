# Edge nginx — the ONLY thing cloudflared talks to. Two `server` blocks:
# the app (SPA + API + WS) on the main host, and a separate storage
# subdomain that reverse-proxies MinIO so SigV4 presigned URLs validate.
#
# Trusting the whole compose network is sound ONLY because `edge` publishes no
# externally-reachable port and cloudflared is the sole ingress. That
# precondition is guarded by tests/unit/test_compose_port_exposure.py.
set_real_ip_from 0.0.0.0/0;
real_ip_header    CF-Connecting-IP;
real_ip_recursive off;

# Cloudflare terminates TLS and talks HTTP to the tunnel, so `$scheme` here
# is always "http" — using it for redirects would make Starlette build
# `http://` links on a page the browser loaded over https (mixed-content
# block). `X-Forwarded-Proto` is what Cloudflare actually sets to the
# original scheme; fall back to `$scheme` only for the case nothing set it
# (e.g. a direct curl against `edge` in local dev, bypassing cloudflared).
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Key by client address only for state-changing verbs. An empty string key
# means "do not apply this zone" (nginx's own documented behavior for
# limit_req_zone), which is how `api_write` below ends up write-only without
# a second `location` block duplicating every route.
map $request_method $write_key {
    default "";
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    PATCH   $binary_remote_addr;
    DELETE  $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=api_read:10m  rate=20r/s;
limit_req_zone $write_key          zone=api_write:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=uploads:10m   rate=12r/m;
limit_req_zone $binary_remote_addr zone=inference:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=storage:10m   rate=30r/s;
limit_conn_zone $binary_remote_addr zone=wsconn:10m;

limit_req_status 429;
limit_conn_status 429;

# Presigned URLs carry `X-Amz-Signature`/`X-Amz-Credential` as query params.
# The default nginx `combined` format logs `$request`/`$request_uri`, which
# would put a live, still-valid signature on disk — this format uses `$uri`
# only (no `$args`/`$query_string`), reconciling with ADR-009's rejection of
# `?token=` on the same grounds.
log_format storage_safe '$remote_addr - [$time_local] "$uri" $status $body_bytes_sent';

# ---------------------------------------------------------------------------
# Server 0 — the catch-all. MUST stay first and MUST stay default_server.
#
# Without it, nginx makes the FIRST server block the default, so any Host it
# does not recognise lands on the app — where `try_files $uri /index.html`
# answers 200 with the SPA. The failure that makes concrete: the storage
# hostname is written in three places that nothing links (this file's
# `server_name`, docker/cloudflared/config.yml's `hostname:`, and
# MINIO_PUBLIC_URL in .env). Typo any one of them and a presigned object
# fetch returns an HTML page with status 200 — the browser saves `index.html`
# named `model.gguf`, and the signature was never even checked. 421 turns a
# silent, self-consistent-looking success into an obvious misroute.
#
# Empty `server_name ""` matches requests carrying no Host at all (HTTP/1.0,
# raw port scans); it is not the same as omitting the directive.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name "";

    access_log off;
    default_type application/json;
    return 421 '{"detail":"Unrecognised Host at the edge. This request did not match the app or storage vhost — check server_name here, the cloudflared ingress hostnames, and MINIO_PUBLIC_URL agree.","code":"misdirected_request"}';
}

# ---------------------------------------------------------------------------
# Server 1 — the app: SPA + API + WebSocket.
# ---------------------------------------------------------------------------
server {
    listen 80;
    # `localhost`/`127.0.0.1` for the compose healthcheck and EDGE_PORT
    # loopback debugging; `edge` for in-network probes. Omit any of them and
    # the catch-all above answers 421 instead, which looks like an outage.
    server_name slmpc.pasaflow.com localhost 127.0.0.1 edge;

    root /usr/share/nginx/html;
    index index.html;

    # Volume mount point — whichever frontend eventually wins (this repo's
    # own `frontend/` on feat/web-ui, or something else) just mounts its
    # `dist` here via `${SPA_DIST_DIR}` in docker-compose.yml. This file
    # does not care which one it is.
    location / {
        try_files $uri /index.html;
    }

    # 1 MiB default. The app's own caps are 10 MiB JSONL / 25 MiB PDF
    # (ai_engine/data_gen/constants.py MAX_SEED_PDF_BYTES) — nginx's default
    # would block both, so the dataset-upload location below raises it.
    client_max_body_size 1m;

    # Deliberately NOT proxied: /docs, /redoc, /openapi.json, /ready. This is
    # a public-internet threat model (ADR decision #3/#12) — none of those
    # are meant for anonymous internet callers, and there is no anonymous-
    # safe subset of "here is the whole API schema" to carve out. They fall
    # through to the SPA fallback above (a 200 with index.html, not a 404 —
    # acceptable, since nothing about that response discloses anything).

    location /api/v1/datasets/ {
        client_max_body_size 32m;   # 25 MiB PDF cap + multipart header room
        limit_req zone=uploads burst=5 nodelay;

        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # OVERWRITE, not $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /api/v1/inference/ {
        limit_req zone=inference burst=10 nodelay;

        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # OVERWRITE, not $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /api/ {
        # Both zones stacked: `api_read` bounds every request, `api_write`
        # additionally bounds state-changing ones via the $write_key map
        # above (which is "" — i.e. unenforced — for GET/HEAD/OPTIONS).
        limit_req zone=api_read  burst=40 nodelay;
        limit_req zone=api_write burst=5  nodelay;

        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # OVERWRITE, not $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location = /health {
        # No rate limit — uptime monitors hit this on their own schedule and
        # must not be starved by unrelated API traffic.
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # OVERWRITE, not $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /ws/ {
        limit_conn wsconn 10;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # nginx forwards Sec-WebSocket-Protocol (the bearer-JWT subprotocol,
        # ADR-009) through untouched — no explicit header line needed here.
        # What actually breaks browsers if this ever regresses is the
        # *response* echoing `Sec-WebSocket-Protocol: bearer` on the 101;
        # that is a server-side (api/ws) behavior this proxy has no opinion
        # on, and is verified on-box (see the plan's VM verification list),
        # not by any text guard in this repo.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # OVERWRITE, not $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Training/SDG jobs can idle longer than nginx's 60s default between
        # progress frames; without this the socket is silently dropped
        # mid-job.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # JSON error bodies matching api/schemas/responses.py::ErrorResponse —
    # nginx's default HTML error pages would otherwise leak past the API's
    # own error contract for exactly the two failure modes this edge layer
    # itself introduces (body-too-large, rate-limited).
    error_page 413 = @413_json;
    error_page 429 = @429_json;

    location @413_json {
        default_type application/json;
        return 413 '{"detail":"Request body exceeds the upload size limit.","code":"payload_too_large","extra":null}';
    }

    location @429_json {
        default_type application/json;
        return 429 '{"detail":"Too many requests. Please slow down and retry shortly.","code":"rate_limited","extra":null}';
    }
}

# ---------------------------------------------------------------------------
# Server 2 — storage: reverse-proxies MinIO for presigned SigV4 downloads.
# Nothing here proxies to `api:8000`; nothing in the app server above
# proxies to `minio:9000`. Deliberately no SPA root, no /api/, no /ws in
# this server block — this subdomain does exactly one thing.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name storage.slmpc.pasaflow.com;

    access_log /var/log/nginx/storage.log storage_safe;  # $uri only: presigned signatures must never reach disk
    add_header Cache-Control "private, no-store" always;
    limit_req zone=storage burst=60 nodelay;

    location / {
        proxy_pass http://minio:9000;   # NO trailing slash, NO rewrite: SigV4 signs the canonical URI
        proxy_set_header Host $host;    # NOT $proxy_host (= minio:9000) — that breaks every signature
        proxy_buffering off;            # a 2GB GGUF would otherwise spool to this container's disk first
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
    }
}
