# Isolated, disposable local integration services; credentials are test fixtures.
# docker compose --env-file /dev/null -p slm-template-tests -f docker/compose.template-tests.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: template_tests
      POSTGRES_USER: template_test
      POSTGRES_PASSWORD: template_test_only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - template_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template_test -d template_tests"]
      interval: 2s
      timeout: 2s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: template_test
      MINIO_ROOT_PASSWORD: template_test_only
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - template_minio:/data
volumes:
  template_pg:
  template_minio:
