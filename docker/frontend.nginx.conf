server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — createBrowserRouter (frontend/src/App.tsx) uses HTML5
    # history mode, so any path that doesn't match a static asset must
    # resolve to index.html and let react-router handle it client-side.
    location / {
        try_files $uri /index.html;
    }

    # REST API — proxied server-side to the `api` container over the compose
    # network. Paths already include the /api/v1 prefix (see
    # frontend/src/api/endpoints/*.ts), and proxy_pass has no trailing path
    # here, so the full URI is forwarded unchanged — no rewrite needed.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket job-progress channel (/ws/jobs/{job_id}). frontend/src/api/ws.ts
    # builds this URL from window.location.host, so it MUST stay same-origin
    # with the page — this proxy is what makes that work outside dev.
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Training/SDG jobs can idle longer than nginx's 60s default between
        # progress frames; without this the socket is silently dropped
        # mid-job.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
