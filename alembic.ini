# Alembic config — see https://alembic.sqlalchemy.org/en/latest/tutorial.html
#
# `sqlalchemy.url` is left blank intentionally; alembic/env.py reads
# `ALEMBIC_DATABASE_URL` (preferred) or `DATABASE_URL` from the environment
# at runtime, so secrets never live in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Use ISO date prefixes so `ls alembic/versions` sorts chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Tell Alembic to use Python's logging config below.
[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix --select I REVISION_SCRIPT_FILENAME

# ---------- logging ---------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
